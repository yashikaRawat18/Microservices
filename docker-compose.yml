version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  configserver:
    build:
      context: ./ConfigServer
      dockerfile: Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/config-repo

  autherservice:
    build:
      context: ./AutherService
      dockerfile: Dockerfile
    container_name: autherservice
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/AuthService?useSSL=false&allowPublicKeyRetrieval=true

  orderservice:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: orderservice
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configserver:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/orderservice?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  notificationservice:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: notificationservice
    ports:
      - "8092:8092"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      configserver:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/notificationservice?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  apigateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_started
      autherservice:
        condition: service_started
      orderservice:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888

volumes:
  mysql_data: